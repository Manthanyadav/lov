<head>

<title>Sorry Mona ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    animation:bg 12s ease infinite;

@keyframes bg{
    0%{background-position:0% 50%;}

.card{
    width:90%;
    max-width:550px;

    border-radius:25px;

    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.15);

    box-shadow:0 8px 30px rgba(0,0,0,.2);

    margin-bottom:15px;

.subtitle{

    line-height:1.6;

.buttons{
    margin-top:30px;
    position:relative;

}

button{

    padding:12px 25px;

    font-size:1rem;
    font-weight:600;

    background:white;
    color:#ff4d6d;
}

#yesBtn:hover{
    transform:scale(1.08);
}

#noBtn{
    position:absolute;
    left:260px;

    color:white;

    margin-top:20px;
    text-align:left;

    position:fixed;
    top:-50px;

        transform:translateY(110vh) rotate(360deg);
    }

</style>
</head>
<body>

<div class="card">

    <h1 id="title">Mona ❤️</h1>

    <p class="subtitle" id="subtitle">
        Mujhse galti ho gayi... 🥺<br>
        Please mujhe ek chance de do.
    </p>

    <div class="buttons" id="buttons">
        <button id="yesBtn" onclick="forgiveMe()">
            I Forgive You ❤️
        </button>

        <button id="noBtn">
            Still Angry 😔
        </button>
    </div>

    <div id="message"></div>

</div>

<script>

const noBtn = document.getElementById("noBtn");

function moveButton(){
    const x = Math.random() * 300 - 150;
    const y = Math.random() * 250 - 125;

    noBtn.style.transform =
    `translate(${x}px, ${y}px)`;
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

const apologyText = `Mona ❤️,

Mujhe pata hai ki maine tumhe hurt kiya hai aur uske liye main dil se sorry bolta hu.

Main maanta hu ki meri galti thi aur mujhe us baat ka afsos hai.

Tum meri life ki sabse special person ho aur main tumhe khona nahi chahta.

Main promise karta hu ki main apni galtiyon se seekhunga, tumhari feelings ki respect karunga aur aage se tumhe kabhi jaan-bujhkar hurt nahi karunga.

Please mujhe ek aur chance de do.

I Love You So Much Mona ❤️✨`;

let index = 0;

function forgiveMe(){

    document.getElementById("title").innerHTML =
    "Thank You Mona ❤️";

    document.getElementById("subtitle").innerHTML =
    "You mean the world to me 🌍❤️";

    document.getElementById("buttons").style.display =
    "none";

    const msg = document.getElementById("message");
    msg.style.display = "block";

    typeWriter();
    heartRain();
}

function typeWriter(){

    const msg = document.getElementById("message");

    if(index < apologyText.length){

        msg.innerHTML += apologyText.charAt(index);

        index++;

        setTimeout(typeWriter,40);

    }else{

        setTimeout(()=>{
            msg.innerHTML +=
            "<br><br><center><h2>🥺 Will You Give Me One More Chance? ❤️</h2></center>";
        },1000);

    }
}

function heartRain(){

    const emojis = ["❤️","💖","🌸","✨","🥰"];

    setInterval(()=>{

        const heart =
        document.createElement("div");

        heart.classList.add("heart");

        heart.innerHTML =
        emojis[Math.floor(Math.random()*emojis.length)];

        heart.style.left =
        Math.random()*100 + "vw";

        heart.style.animationDuration =
        (Math.random()*3+2)+"s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },5000);

    },250);
}
</script>

</body>
</html>
